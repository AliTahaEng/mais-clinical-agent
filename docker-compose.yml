version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Medical Autonomous Intelligence System — full stack
#
# Services:
#   neo4j    — knowledge graph (Graph RAG)
#   postgres — LangGraph checkpoints + audit log
#   redis    — approval store + idempotency cache
#   backend  — FastAPI + LangGraph (depends on all 3 DBs)
#   frontend — Next.js 14 (depends on backend)
#
# Volumes:
#   Named volumes: neo4j, postgres, redis, hf_model_cache
#   Bind mounts:   ./data/ → /app/data/ (LanceDB, documents, uploads)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: mais_neo4j
    ports:
      - "7474:7474"   # browser UI  → http://localhost:7474
      - "7687:7687"   # Bolt driver
    environment:
      NEO4J_AUTH: neo4j/tpKnzIbSTPt6-1AX7AARWi2ZoC24RV_AE3q5XPgOAbo
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      # Neo4j 5.x memory settings (renamed from dbms.memory.* to server.memory.*)
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      # Disable strict config validation so unknown settings are warnings not errors
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - mais_net

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mais_postgres
    ports:
      - "5433:5432"   # host 5433 (avoids conflict with other projects)
    environment:
      POSTGRES_DB: mais_db
      POSTGRES_USER: mais_user
      POSTGRES_PASSWORD: alitaha123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mais_user -d mais_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - mais_net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mais_redis
    ports:
      - "6380:6379"   # host 6380 (avoids conflict with other projects)
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mais_net

  # ── Backend (FastAPI + LangGraph) ──────────────────────────────────────────
  backend:
    build:
      context: ./medical_ais
      dockerfile: Dockerfile
    container_name: mais_backend
    ports:
      - "8001:8000"   # host 8001 (avoids conflict with other projects)
    env_file:
      - ./medical_ais/.env
    environment:
      # JSON array required by pydantic-settings v2 for list fields
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8001","http://frontend:3000"]'
      # Override localhost URLs → Docker service names
      NEO4J_URI: bolt://neo4j:7687
      POSTGRES_URL: postgresql+asyncpg://mais_user:alitaha123@postgres:5432/mais_db
      REDIS_URL: redis://redis:6379/0
      # LanceDB path inside container
      LANCEDB_PATH: /app/data/lancedb
      DOCUMENTS_DIR: /app/data/documents
      # Auth — change these in production!
      JWT_SECRET: "change-me-jwt-secret-use-a-long-random-string-in-prod!!"
      ADMIN_EMAIL: "admin@mais.local"
      ADMIN_PASSWORD: "Admin1234!"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
    volumes:
      # Bind mounts — data persists on host at ./data/
      - ./data/lancedb:/app/data/lancedb
      - ./data/documents:/app/data/documents
      - ./data/uploads:/app/data/uploads
      # HuggingFace model cache — downloads BGE-M3 once, reuses on restart
      - hf_model_cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s   # Give time for model download on first run
    restart: unless-stopped
    networks:
      - mais_net

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: mais_frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mais_net

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  postgres_data:
  redis_data:
  hf_model_cache:    # HuggingFace BGE-M3 + cross-encoder model cache

# ─────────────────────────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────────────────────────
networks:
  mais_net:
    name: mais_network
    driver: bridge
